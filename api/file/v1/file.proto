syntax = "proto3";

package gophkeeper.file.v1;

option go_package = "github.com/Radiushina/GophKeeper/gen/filepb";

service FileService {
  rpc Upload(stream UploadChunk) returns (UploadAck);
  rpc Download(DownloadReq) returns (stream DownloadChunk);
  rpc UploadStatus(UploadStatusReq) returns (UploadStatusRes);
  rpc UpdateMeta(UpdateMetaReq) returns (UploadAck);
}

message UploadChunk {
  oneof payload {
    UploadHeader header = 1;
    UploadData data = 2;
  }
}

message UploadHeader {
  string id = 1;
  int64 version = 2;
  string name = 3;
  string meta = 4;
  int64 size = 5;
  int32 resume_from = 6;
}

message UploadData {
  int32 index = 1;
  bytes nonce = 2;
  bytes ciphertext = 3;
}

message UploadAck {
  string id = 1;
  int64 version = 2;
  int32 chunks = 3;
}

message DownloadReq {
  string id = 1;
  int32 from_index = 2;
}

message DownloadChunk {
  int32 index = 1;
  bytes nonce = 2;
  bytes ciphertext = 3;
  string name = 4;
  string meta = 5;
  int64 version = 6;
  int32 chunks = 7;
}

message UploadStatusReq {
  string id = 1;
}

message UploadStatusRes {
  int32 next_index = 1;
  int32 chunks = 2;
}

message UpdateMetaReq {
  string id = 1;
  int64 version = 2;
  string name = 3;
  string meta = 4;
}
