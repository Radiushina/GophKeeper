services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: my_pass
      POSTGRES_DB: gophkeeper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d gophkeeper"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "9090:8080"
    environment:
      GOPHKEEPER_SERVER_HTTP_ADDRESS: ":8080"
      GOPHKEEPER_DATABASE_DSN: postgres://developer:my_pass@postgres:5432/gophkeeper?sslmode=disable
      GOPHKEEPER_AUTH_JWT_SECRET: change-me
      GOPHKEEPER_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
