services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: my_pass
      POSTGRES_DB: gophkeeper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U developer -d gophkeeper"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:5
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "9090:8080"
      - "9091:9091"
    environment:
      GOPHKEEPER_SERVER_HTTP_ADDRESS: ":8080"
      GOPHKEEPER_SERVER_GRPC_ADDRESS: ":9091"
      GOPHKEEPER_DATABASE_DSN: postgres://developer:my_pass@postgres:5432/gophkeeper?sslmode=disable
      GOPHKEEPER_AUTH_JWT_SECRET: ${GOPHKEEPER_AUTH_JWT_SECRET}
      GOPHKEEPER_LOG_LEVEL: info
      GOPHKEEPER_S3_ENDPOINT: http://minio:9000
      GOPHKEEPER_S3_REGION: us-east-1
      GOPHKEEPER_S3_BUCKET: gophkeeper
      GOPHKEEPER_S3_ACCESS_KEY: minio
      GOPHKEEPER_S3_SECRET_KEY: minio12345
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
